# =========================================================
# Ajustes OPCIONAIS de nginx para clarmcontabilidade.com.br
#
# Onde colar: DENTRO do bloco "server { ... }" que já atende
# clarmcontabilidade.com.br (o da porta 443, com o certificado SSL).
# Depois de colar, teste e recarregue:
#   nginx -t && systemctl reload nginx
# Se "nginx -t" mostrar erro, desfaça a colagem.
# =========================================================

# Obriga o navegador a sempre usar HTTPS (cadeado)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# Página própria para endereço inexistente
error_page 404 /404.html;

# Compressão: páginas carregam mais rápido
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

# Guarda em cache imagens, fontes, CSS e JS por 30 dias
# (os arquivos têm "?v=data" no endereço, então atualizações aparecem na hora)
location ~* \.(?:css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
