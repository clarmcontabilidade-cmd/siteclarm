# /etc/nginx/sites-available/dynosai
# Site institucional Dynos AI - servido como HTML estatico
# Com headers de seguranca e LGPD

server {
    listen 80;
    server_name dynosai.com.br www.dynosai.com.br;

    root /opt/dynosai-site;
    index index.html;

    # Headers de seguranca (LGPD/boas praticas)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache agressivo pra assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /produtos/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Logs
    access_log /var/log/nginx/dynosai_access.log;
    error_log /var/log/nginx/dynosai_error.log;
}
